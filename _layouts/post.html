---
layout: default
---

<article class="post post-with-sidebar">
  <div class="post-layout">
    <aside class="post-toc-wrap">
      <nav class="post-toc" id="post-toc" aria-label="文章目录">
        <div class="toc-title">目录</div>
        <ul class="toc-list" id="toc-list"></ul>
      </nav>
    </aside>

    <div class="post-main">
      <header class="post-header">
        <h1 class="post-title">{{ page.title }}</h1>
        <div class="post-meta">
          <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y年%m月%d日" }}</time>
          {% if page.author %}
          <span class="author"> · {{ page.author }}</span>
          {% endif %}
        </div>
      </header>

      <div class="post-content">
        {{ content }}
      </div>

      <footer class="post-footer">
        <a href="{{ '/blog/' | relative_url }}">← 返回博客列表</a>
      </footer>
    </div>
  </div>
</article>

<script src="{{ '/assets/js/toc.js' | relative_url }}" defer></script>
