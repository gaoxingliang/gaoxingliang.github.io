<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
  {% assign asset_version = site.time | date: '%s' %}
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ asset_version }}">
  <link rel="stylesheet" href="{{ '/assets/css/theme.css' | relative_url }}?v={{ asset_version }}">
  {% if page.layout == 'home' %}<link rel="stylesheet" href="{{ '/assets/css/home.css' | relative_url }}?v={{ asset_version }}">{% endif %}
  <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
  {% seo %}
</head>
<body{% if page.layout == 'home' %} class="home-page"{% endif %}>
  <a class="skip-link" href="#main-content">跳到正文</a>
  <header class="site-header">
    <div class="container">
      <a href="{{ '/' | relative_url }}" class="site-title">{{ site.title }}</a>
      <nav class="site-nav" aria-label="主导航">
        <a href="{{ '/' | relative_url }}"{% if page.layout == 'home' %} aria-current="page"{% endif %}>首页</a>
        <a href="{{ '/blog/' | relative_url }}"{% if page.layout == 'blog' or page.layout == 'post' %} aria-current="page"{% endif %}>博客</a>
        <a href="{{ '/archives/' | relative_url }}"{% if page.url contains '/archives' %} aria-current="page"{% endif %}>归档</a>
        <a href="{{ '/tags/' | relative_url }}"{% if page.url contains '/tags' %} aria-current="page"{% endif %}>标签</a>
        <a href="{{ '/categories/' | relative_url }}"{% if page.url contains '/categories' %} aria-current="page"{% endif %}>分类</a>
        <a href="{{ '/search/' | relative_url }}"{% if page.url contains '/search' %} aria-current="page"{% endif %}>搜索</a>
      </nav>
    </div>
  </header>

  <main class="main-content" id="main-content" tabindex="-1">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; {{ 'now' | date: '%Y' }} {{ site.title }}. Powered by <a href="https://jekyllrb.com/">Jekyll</a> & <a href="https://pages.github.com/">GitHub Pages</a>.</p>
    </div>
  </footer>
</body>
</html>
