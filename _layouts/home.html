---
layout: default
---

<div class="home">
  <div class="container">
    <section class="hero">
      <h1>{{ site.title }}</h1>
      <p class="tagline">{{ site.description }}</p>
    </section>

    <section class="recent-posts">
      <h2>最新文章</h2>
      <ul class="post-list">
        {% for post in site.posts limit:5 %}
        <li>
          <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
          <span class="post-date">{{ post.date | date: "%Y-%m-%d" }}</span>
        </li>
        {% endfor %}
      </ul>
      <a href="{{ '/blog/' | relative_url }}" class="view-all">查看全部文章 →</a>
    </section>
  </div>
</div>
